name: BreatheWise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci || npm install

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Code Quality & Lint Verification
        run: npx oxlint

      - name: Run Server Automated Tests (38 Tests)
        run: |
          cd server
          npm test

      - name: Build Server (TypeScript Compile)
        run: |
          cd server
          npm run build

      - name: Build Client (Vite Bundle)
        run: |
          cd client
          npm run build
