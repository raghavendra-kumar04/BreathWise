services:
  - type: web
    name: breathewise-api
    env: node
    plan: free
    buildCommand: npm install && npm --prefix server install && npm --prefix server run build
    startCommand: npm --prefix server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
